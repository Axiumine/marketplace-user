# The customer vhost. Install to /etc/nginx/sites-available/marketplace-user.conf
#
# Requires conf.d/cache.conf and conf.d/rate-limit.conf to be loaded at http level.
# Replace <customer-domain> and the certificate paths.
#
# This domain is the CUSTOMER domain and is distinct from the shop-owner and operator
# domains on purpose: the email-verification link the platform sends to a customer is built
# from APP_DOMAIN_USER and lands here, on /check/verify-email-user/. The shop-owner link
# keeps /check/verify-email/ on its own host. Two paths, two hosts, no ambiguity and no
# rewrite between them.

server {
	listen 80;
	listen [::]:80;
	server_name <customer-domain>;

	# ACME lives on :80 and nothing else does.
	location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
	location / { return 308 https://$host$request_uri; }
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	http2 on;
	server_name <customer-domain>;

	ssl_certificate     /etc/letsencrypt/live/<customer-domain>/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/<customer-domain>/privkey.pem;
	ssl_protocols       TLSv1.2 TLSv1.3;
	ssl_prefer_server_ciphers off;
	ssl_session_cache   shared:MozSSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;
	ssl_stapling on;
	ssl_stapling_verify on;

	# Per-request CSP nonce. See snippets/security-headers.conf — it must reach the SSR
	# renderer or the hydration script is blocked.
	set $csp_nonce $request_id;

	root /srv/marketplace-user/dist/client;
	index index.html;

	client_max_body_size 12m;          # item images go through the resource service, not here
	limit_conn mkt_conn 64;

	gzip              on;
	gzip_vary         on;
	gzip_comp_level   5;
	gzip_min_length   1024;
	gzip_proxied      any;
	gzip_types        text/plain text/css text/xml application/javascript application/json
	                  application/xml application/rss+xml image/svg+xml application/manifest+json;
	# brotli is better here but ships as a third-party module; enable it if the build has it:
	#   brotli on; brotli_comp_level 5; brotli_types <same list>;

	include snippets/security-headers.conf;

	access_log /var/log/nginx/marketplace-user.access.log;
	error_log  /var/log/nginx/marketplace-user.error.log warn;

	# ------------------------------------------------------------------------------
	# Shared proxy behaviour
	# ------------------------------------------------------------------------------
	proxy_http_version 1.1;
	proxy_set_header Connection        "";
	proxy_set_header Host              $host;
	proxy_set_header X-Real-IP         $remote_addr;
	proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
	proxy_set_header X-Forwarded-Proto $scheme;
	proxy_set_header X-Forwarded-Host  $host;
	proxy_connect_timeout 5s;
	proxy_send_timeout    30s;
	proxy_read_timeout    30s;

	# ------------------------------------------------------------------------------
	# Static build output — content-hashed, therefore immutable.
	# ------------------------------------------------------------------------------
	location /assets/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		include snippets/security-headers.conf;   # add_header above discarded the inherited set
		access_log off;
		try_files $uri =404;
	}

	location /fonts/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable" always;
		add_header Cross-Origin-Resource-Policy "same-origin" always;
		include snippets/security-headers.conf;
		access_log off;
		try_files $uri =404;
	}

	# ------------------------------------------------------------------------------
	# Map tiles — one PMTiles archive, read by the client with HTTP range requests.
	# Static file serving already answers ranges; the point of this block is the CORP
	# header and a cache lifetime that matches the refresh job, not the request handling.
	# ------------------------------------------------------------------------------
	location /tiles/ {
		alias /srv/marketplace-user/tiles/;
		add_header Accept-Ranges "bytes" always;
		add_header Cache-Control "public, max-age=604800" always;   # one week; refresh job is monthly
		add_header Cross-Origin-Resource-Policy "same-origin" always;
		include snippets/security-headers.conf;
		access_log off;
		try_files $uri =404;
	}

	# ------------------------------------------------------------------------------
	# GraphQL endpoints. Never cached — every one of them is a POST, and Apollo is
	# configured with csrfPrevention:true while urql sends preferGetMethod:false, so a
	# GET here is a bug rather than an optimisation.
	# ------------------------------------------------------------------------------

	# Public catalogue, search, map data, sitemap source. Also carries userRegister, which
	# is why registration ALSO has to be limited in-app: nginx cannot tell one GraphQL
	# operation from another inside a POST body. The /api/register route below is the edge
	# half of that; the Redis limiter in the resolver is the half that actually counts.
	location = /public-resource {
		limit_req zone=mkt_public burst=40 nodelay;
		proxy_pass http://mkt_public_resource;
	}

	# login / loginUser. Tight: bcrypt at 14 rounds on every attempt.
	location = /public-authorization {
		limit_req zone=mkt_auth burst=10 nodelay;
		proxy_pass http://mkt_public_authz;
	}

	location = /user-authenticated-authorization {
		limit_req zone=mkt_auth burst=20 nodelay;
		proxy_pass http://mkt_user_authz;
	}

	location = /user-authenticated-resource {
		limit_req zone=mkt_public burst=40 nodelay;
		proxy_pass http://mkt_user_resource;
	}

	# Shared across all three tiers — the resolver deletes Redis keys by token content and
	# never inspects which model minted them.
	location = /logout {
		proxy_pass http://mkt_logout;
	}

	# ------------------------------------------------------------------------------
	# Email verification click-through (REST, not GraphQL).
	# The customer route is /check/verify-email-user/:email/:hash. The shop-owner route
	# /check/verify-email/ is NOT exposed on this host — it belongs to the other domain.
	# Every failure path of this endpoint redirects to the same URL by design, so it
	# cannot be used to probe whether an account exists; do not "improve" that by adding
	# distinguishing error pages here.
	# ------------------------------------------------------------------------------
	location ^~ /check/verify-email-user/ {
		limit_req zone=mkt_verify burst=10 nodelay;
		proxy_pass http://mkt_public_resource;
	}

	location = /check/ {
		proxy_pass http://mkt_public_resource;
		access_log off;
	}

	# ------------------------------------------------------------------------------
	# Registration, proxied through the SSR server so it has a URL of its own that the
	# edge can see and limit — a GraphQL POST body does not give nginx one. The server
	# route verifies the Turnstile token, then forwards to the userRegister mutation, so
	# the Turnstile secret never leaves the SSR process.
	# ------------------------------------------------------------------------------
	location = /api/register {
		limit_req zone=mkt_register burst=3 nodelay;
		proxy_pass http://mkt_user_ssr;
	}

	location /api/ {
		limit_req zone=mkt_auth burst=20 nodelay;
		proxy_pass http://mkt_user_ssr;
	}

	# ------------------------------------------------------------------------------
	# On-premises geocoder. Never exposed directly — the browser talks to this path and
	# nginx alone knows where Nominatim actually lives. See docs/nominatim/README.md.
	# ------------------------------------------------------------------------------
	location /geocode/ {
		limit_req zone=mkt_geocode burst=20 nodelay;
		proxy_pass http://mkt_nominatim/;
		proxy_cache      mkt_user_html;
		proxy_cache_valid 200 1h;         # the same address is typed by many people
		proxy_cache_key  "$scheme$request_method$host$request_uri";
		add_header X-Cache-Status $upstream_cache_status always;
		include snippets/security-headers.conf;
	}

	# ------------------------------------------------------------------------------
	# Everything else: server-rendered HTML, cached for anonymous visitors only.
	# ------------------------------------------------------------------------------
	location / {
		proxy_pass http://mkt_user_ssr;
		proxy_set_header X-CSP-Nonce $csp_nonce;

		# Normalise the variant space: one cached entity per URL, compressed by nginx on
		# the way out. Without this the upstream's own gzip splits the cache by encoding.
		proxy_set_header Accept-Encoding "";

		proxy_cache      mkt_user_html;
		proxy_cache_key  "$scheme$request_method$host$request_uri";

		# A visitor with a session skips the lookup AND is never stored. Both directives
		# are required: proxy_cache_bypass alone still writes the personalised response
		# into the cache for the next anonymous visitor to receive.
		proxy_cache_bypass   $mkt_user_no_cache;
		proxy_no_cache       $mkt_user_no_cache;

		proxy_cache_valid 200 301 302 60s;
		proxy_cache_valid 404           10s;
		proxy_cache_min_uses 1;

		# stale-while-revalidate: serve the stale copy instantly, refresh behind it, and
		# collapse a thundering herd onto one upstream request.
		proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
		proxy_cache_background_update on;
		proxy_cache_lock on;
		proxy_cache_lock_timeout 5s;

		# nginx already refuses to cache a response carrying Set-Cookie. That default is
		# load-bearing here — do NOT add `proxy_ignore_headers Set-Cookie`.

		add_header X-Cache-Status $upstream_cache_status always;
		include snippets/security-headers.conf;
	}

	# robots.txt and the sitemap shards are generated by the app, so they fall through to
	# `location /` and are cached with everything else. No special case needed.

	location = /health {
		proxy_pass http://mkt_user_ssr;
		access_log off;
	}

	# Never serve dotfiles out of the build directory.
	location ~ /\. { deny all; }
}
