# http-level. Install to /etc/nginx/conf.d/cache.conf
#
# HTML cache for the anonymous customer surface. The private area is client-rendered and
# therefore produces no cacheable HTML at all; this layer is the second line of defence,
# keyed on the session cookie.

proxy_cache_path /var/cache/nginx/marketplace-user
                 levels=1:2
                 keys_zone=mkt_user_html:64m   # ~500k keys
                 max_size=4g
                 inactive=24h
                 use_temp_path=off;            # write straight into the cache tree, no cross-device copy

# --------------------------------------------------------------------------------------
# Bypass decision.
#
# `refresh_token` is the Keygrip-signed httpOnly cookie the platform sets on login, and
# `refresh_token.sig` is its signature. Presence of either means "this visitor has a
# session" — that is all we need to know, and we deliberately never parse it here.
# --------------------------------------------------------------------------------------
map $http_cookie $mkt_user_has_session {
	default                 0;
	"~*(^|;\s*)refresh_token(\.sig)?="  1;
}

# Requests that must skip the cache lookup AND must never be stored.
map $mkt_user_has_session $mkt_user_no_cache {
	0  0;
	1  1;
}

# --------------------------------------------------------------------------------------
# Upstreams. All bind the wildcard address and listen on loopback-reachable ports; see
# the service table in the workspace CLAUDE.md.
# --------------------------------------------------------------------------------------
upstream mkt_user_ssr            { server 127.0.0.1:3045; keepalive 32; }  # TanStack Start node server
upstream mkt_public_resource     { server 127.0.0.1:4027; keepalive 16; }
upstream mkt_public_authz        { server 127.0.0.1:4028; keepalive 16; }
upstream mkt_user_authz          { server 127.0.0.1:4031; keepalive 16; }
upstream mkt_user_resource       { server 127.0.0.1:4032; keepalive 16; }
upstream mkt_logout              { server 127.0.0.1:4030; keepalive 8;  }
upstream mkt_nominatim           { server 127.0.0.1:8080; keepalive 8;  }  # on-prem geocoder, see docs/nominatim
