# server/location-level snippet. Install to /etc/nginx/snippets/security-headers.conf
#
# ⚠️ nginx `add_header` does NOT merge: a location block that declares even one
# `add_header` of its own discards every header inherited from the server block. Every
# location in marketplace-user.conf that adds a header therefore re-includes this file.
# If you add a location, include it there too or that response ships bare.
#
# ⚠️ $csp_nonce must be set by the enclosing server block:
#       set $csp_nonce $request_id;
# and forwarded upstream so the SSR renderer can stamp it on its hydration scripts:
#       proxy_set_header X-CSP-Nonce $csp_nonce;
# $request_id is a per-request 32-hex value, which is exactly what a nonce needs to be.
# Without the round trip the app's inline hydration script is blocked and the page never
# becomes interactive — this is the failure mode to check first if hydration "just stops".

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy  "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;

# geolocation=(self) is deliberate: "shops near me" asks the browser for a position.
# Everything else is off.

add_header Content-Security-Policy "\
default-src 'self'; \
base-uri 'self'; \
object-src 'none'; \
frame-ancestors 'none'; \
form-action 'self'; \
script-src 'self' 'nonce-$csp_nonce' 'strict-dynamic' https://challenges.cloudflare.com; \
style-src 'self' 'unsafe-inline'; \
img-src 'self' data: blob:; \
font-src 'self'; \
connect-src 'self' https://*.ingest.sentry.io; \
worker-src 'self' blob:; \
child-src blob:; \
frame-src https://challenges.cloudflare.com; \
manifest-src 'self'; \
upgrade-insecure-requests" always;

# Notes on the three loosest directives, so nobody tightens them by accident and spends an
# afternoon on it:
#
#   style-src 'unsafe-inline'  — MapLibre GL writes inline styles onto its canvas container
#                                at runtime. Tailwind itself ships as a static stylesheet and
#                                needs nothing here.
#   worker-src blob:           — MapLibre spawns its tile-decoding workers from a blob URL.
#   img-src blob:              — the same workers hand decoded tiles back as blobs.
#
# `frame-ancestors 'none'` replaces X-Frame-Options, which is why that header is absent.
# Add the real Sentry ingest host in place of the wildcard once the DSN is fixed.
