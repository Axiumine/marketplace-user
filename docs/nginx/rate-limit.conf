# http-level. Install to /etc/nginx/conf.d/rate-limit.conf
#
# The platform has no rate limiting of its own — verified, there is not one limiter in any
# of the seven services. These zones bound the public authentication surface at the edge.
# They are a ceiling, not the primary control: Turnstile stops the cheap automated flood
# and the application-level Redis limiter enforces the per-account rules. This layer exists
# so that a flood never reaches Node in the first place.

# Registration: expensive (bcrypt at 14 rounds) and it sends mail from our domain, which is
# how a sending reputation dies. Deliberately the tightest zone.
limit_req_zone $binary_remote_addr zone=mkt_register:10m rate=5r/m;

# Login and password reset: bcrypt on every attempt, and the obvious credential-stuffing target.
limit_req_zone $binary_remote_addr zone=mkt_auth:10m     rate=20r/m;

# Email verification click-through. A human clicks this once; a script enumerating hashes
# does not. The flow itself soft-deletes an account after 5 wrong hashes, so this only has
# to make enumeration slow enough for that guard to fire.
limit_req_zone $binary_remote_addr zone=mkt_verify:10m   rate=30r/m;

# Public GraphQL reads (catalogue, search, map). Generous — this is the normal browsing
# path and a shared NAT sits behind one address.
limit_req_zone $binary_remote_addr zone=mkt_public:20m   rate=120r/m;

# Geocoder autocomplete. The client already debounces; this catches a client that does not.
limit_req_zone $binary_remote_addr zone=mkt_geocode:10m  rate=60r/m;

# Concurrent connections per address — cheap protection against slow-read holding.
limit_conn_zone $binary_remote_addr zone=mkt_conn:10m;

# 429, not 503: this is a client-rate problem and crawlers back off correctly on 429.
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;
